<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counter365 · App redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F5;--s:#fff;--ink:#111;--mu:#76716B;--ln:#EBE7E1;--or:#FF5F00;--os:#FFF0E6;--alt:#F3F0EB;--ot:#D94F00;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"]{--bg:#0B0B0B;--s:#171717;--ink:#F5F3F0;--mu:#9A948D;--ln:#2A2A2A;--os:#3A2111;--sh:0 8px 24px -12px #000}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--s:#171717;--ink:#F5F3F0;--mu:#9A948D;--ln:#2A2A2A;--os:#3A2111;--sh:0 8px 24px -12px #000}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;justify-content:center}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{width:100%;max-width:430px;min-height:100vh;padding:14px 20px 130px;position:relative}
.row{display:flex;align-items:center;gap:12px}.fx{flex:1;min-width:0}
.ib{width:44px;height:44px;border-radius:14px;background:var(--s);box-shadow:var(--sh);display:grid;place-items:center;flex:none;transition:transform .15s}
.ib:active,.btn:active,.sq:active{transform:scale(.94)}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FF8A3D,#FF5F00);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.shop b{font-size:16px;font-weight:700;display:block}.shop span,.mu{font-size:12.5px;color:var(--mu)}
.ph{margin:24px 0 16px}.ph h1{font-size:25px;font-weight:800;letter-spacing:-.02em}.ph p{font-size:13px;color:var(--mu);margin-top:3px}
.badge{font-size:11px;font-weight:800;color:var(--ot);background:var(--os);padding:4px 9px;border-radius:99px;letter-spacing:.04em}
.seg{display:flex;background:var(--s);border-radius:16px;padding:5px;box-shadow:var(--sh);margin:14px 0}
.seg button{flex:1;height:40px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--mu)}.seg .on{background:var(--or);color:#fff}
.search{height:52px;border-radius:16px;background:var(--s);box-shadow:var(--sh);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mu);font-size:14px;margin:14px 0 0}
.chips{display:flex;gap:8px;margin:14px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.c{height:40px;padding:0 16px;border-radius:12px;background:var(--s);border:1px solid var(--ln);font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--mu)}
.c.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.c.o{color:var(--or);background:var(--os);border-color:transparent}
.card{background:var(--s);border-radius:22px;padding:16px;box-shadow:var(--sh);border:1px solid var(--ln);margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:7px}
h2{font-size:17px;font-weight:700;margin:26px 0 4px}
.btn{height:50px;padding:0 20px;border-radius:15px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#fff;box-shadow:0 10px 20px -8px rgba(255,95,0,.55);transition:transform .15s}
.btn.l{background:var(--s);color:var(--ink);box-shadow:none;border:1.5px solid var(--ink)}
.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--os);color:var(--or);flex:none}.sq.k{background:var(--ink);color:var(--bg)}.sq.g{background:var(--bg);color:var(--mu)}
.hero{border-radius:28px;padding:22px;color:#fff;background:radial-gradient(110% 80% at 100% 0%,rgba(255,95,0,.38),transparent 55%),linear-gradient(160deg,#1E1E1E,#0A0A0A);box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.hero .big{font-size:52px;margin:16px 0 4px}.st{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.st div+div{border-left:1px solid rgba(255,255,255,.14);padding-left:14px}.st span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.6;font-weight:600}.st b{display:block;font-size:18px;margin-top:4px}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:110px;padding-top:10px}.bars i{display:block;width:100%;height:5px;border-radius:3px;background:var(--ln);margin-bottom:8px}.bars div{flex:1;text-align:center;font-size:11.5px;color:var(--mu)}
.days{display:flex;gap:8px;margin-top:10px}.days div{flex:1;height:84px;border-radius:99px;background:var(--s);border:1px solid var(--ln);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pi{background:var(--s);border:1px solid var(--ln);border-radius:18px;overflow:hidden;box-shadow:var(--sh);text-align:left;transition:transform .15s}.pi:active{transform:scale(.96)}
.pi .im,.th{display:grid;place-items:center;font-size:34px;height:84px;background:linear-gradient(135deg,#FFE3CC,#FFC59A)}
.pi b{display:block;font-size:13.5px;padding:9px 10px 2px}.pi span{display:flex;justify-content:space-between;align-items:center;padding:0 8px 10px 10px;font-size:12px;color:var(--mu);font-weight:600}.pi span em{font-style:normal;color:var(--ink);font-weight:800}.pi span u{width:26px;height:26px;border-radius:50%;background:var(--os);color:var(--or);display:grid;place-items:center;text-decoration:none;font-weight:700}
.th{width:52px;height:52px;border-radius:16px;font-size:26px;flex:none}
.li{display:flex;align-items:center;gap:13px;background:var(--s);border:1px solid var(--ln);border-radius:20px;padding:13px;margin-top:10px;box-shadow:var(--sh)}
.li b{font-size:15.5px;font-weight:700;display:block}.li small{font-size:12.5px;color:var(--mu)}
.price{font-size:18px;font-weight:800;text-align:right}.fav{font-size:10px;font-weight:800;color:var(--or);background:var(--os);padding:3px 8px;border-radius:99px;display:inline-block;margin-bottom:3px}
.ini{width:48px;height:48px;border-radius:16px;background:var(--os);color:var(--or);font-weight:800;font-size:17px;display:grid;place-items:center;flex:none}
.amtbar{display:flex;gap:8px;margin-top:14px}.amtbar .search{margin:0;flex:1;height:48px}
.tg{width:52px;height:30px;border-radius:99px;background:var(--ln);padding:3px;flex:none;transition:.2s}.tg:after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}.tg.on{background:var(--or)}.tg.on:after{transform:translateX(22px)}
.set{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--ln)}.set b{font-size:15px;font-weight:600;display:block}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:398px;height:64px;border-radius:22px;background:color-mix(in srgb,var(--s) 88%,transparent);backdrop-filter:blur(16px);box-shadow:0 12px 32px -10px rgba(0,0,0,.28);border:1px solid var(--ln);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:5}
.nav button{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--mu)}
.nav .on{width:auto;padding:0 18px;display:flex;gap:8px;align-items:center;background:var(--or);color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 16px -6px rgba(255,95,0,.6)}
.scr{display:none}.scr.show{display:block}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:8}.dim.show{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);background:#141414;color:#F5F3F0;z-index:9;transform:translateX(-100%);transition:transform .28s;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 16px;display:flex;flex-direction:column;overflow-y:auto}.dr.show{transform:none}
.dr .g{font-size:11px;letter-spacing:.12em;font-weight:700;color:#8A847D;margin:22px 10px 8px}
.dr a{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;font-size:15px;font-weight:500;color:#D9D5CF;cursor:pointer}.dr a.on{background:#2A1A10;color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--or)}.dr a.on svg{color:var(--or)}
.dr a em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:#262626;color:#B5AFA8;padding:4px 9px;border-radius:8px}.dr a em.o{background:var(--or);color:#fff}

body{letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{padding-bottom:190px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:-14px -20px 0;padding:14px 20px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#m{animation:up .4s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ph h1{font-size:26px;letter-spacing:-.03em}.card,.li,.pi{border-color:color-mix(in srgb,var(--ln) 70%,transparent)}
.hero .seg{background:rgba(255,255,255,.08);box-shadow:none;margin:18px 0 0;padding:4px}.hero .seg button{color:#B9B3AC;height:36px;font-size:13px}.hero .seg .on{color:#fff}
.mini{margin:0;padding:16px 16px 14px}.mini .big{font-size:26px}
.lk{display:flex;align-items:center;gap:14px;margin-top:12px;padding:16px;border-radius:22px;background:var(--s);border:1px solid var(--ln);box-shadow:var(--sh);width:100%;text-align:left}
.lk .ic{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.pi.sel{border-color:var(--or);box-shadow:0 0 0 2px var(--or),var(--sh)}
.q{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:99px;background:var(--or);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 7px}
.cb{position:fixed;left:50%;transform:translate(-50%,20px);width:calc(100% - 32px);max-width:398px;bottom:calc(90px + env(safe-area-inset-bottom,0px));height:58px;border-radius:18px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;opacity:0;pointer-events:none;transition:.3s;z-index:6;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.cb.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.cb b{font-size:17px}.cb small{display:block;font-size:11.5px;opacity:.65;font-weight:600}.cb .btn{height:42px;border-radius:13px;box-shadow:none}
.grp{background:var(--s);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh);padding:2px 16px;margin-top:12px}.grp .set:last-child{border:0}
.ti{width:42px;height:42px;border-radius:13px;background:var(--bg);display:grid;place-items:center;flex:none}
.hint{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--os);color:var(--or);font-size:12.5px;font-weight:600;margin-top:14px;line-height:1.4}
.sh{display:flex;align-items:center;margin:28px 2px 0}.sh h2{margin:0;flex:1}.sh b{color:var(--or);font-size:13.5px}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--ink);flex:1;min-width:0;height:100%}.search input::placeholder{color:var(--mu)}.search:focus-within{box-shadow:0 0 0 2px var(--or),var(--sh)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-12px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:30;white-space:nowrap;max-width:92vw;box-shadow:0 12px 28px -10px rgba(0,0,0,.5)}.toast.show{opacity:1;transform:translate(-50%,0)}
.sp{position:fixed;inset:0;background:#0A0A0A;z-index:40;display:grid;place-items:center;color:#fff;font-size:34px;letter-spacing:-.03em;transition:opacity .5s,visibility 0s .5s}.sp.off{opacity:0;visibility:hidden}
:root[data-theme="dark"]{--ot:#FF8A3D}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ot:#FF8A3D}}
</style></head><body>
<div class="app">
 <div class="row" id="top"><button class="ib" onclick="dr(1)" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><div class="av">R</div><div class="shop fx"><b>Raja tea stall</b><span>Shop Owner · Wed 7 Oct</span></div><button class="ib" onclick="go('home')" aria-label="Reports"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20v-6"/></svg></button></div>
 <main id="m"></main>
</div>
<nav class="nav" id="nv"></nav><div class="cb" id="cb"></div><div class="toast" id="ts"></div><div class="sp" id="sp"><b>Counter<span style="color:var(--or)">365</span></b></div><div class="dim" id="dm" onclick="dr(0)"></div><aside class="dr" id="dr"></aside>
<script>
const P={home:'M4 11l8-7 8 7v9H4z',bills:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',plus:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8',user:'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20a8 8 0 0 1 16 0',back:'M19 12H5M11 6l-6 6 6 6',ref:'M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5',se:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-3.500-3.500',ph:'M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',wa:'M4 20l1.300-4.200A8 8 0 1 1 8.200 18.800zM9 9.500c0 3 2.500 5.500 5.500 5.500l1-1.500-2-1-.8.800a4 4 0 0 1-1.800-1.800l.8-.8-1-2z',ck:'M5 12.500l4.500 4.500L19 7.500',tr:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',dt:'M12 5v.01M12 12v.01M12 19v.01',ed:'M4 20h4L19 9l-4-4L4 16zM13 7l4 4',pin:'M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11zM12 7.500v3',dash:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',doc:'M7 3h8l4 4v14H7zM10 12h6M10 16h6',clk:'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8v4l3 2',us:'M9 11a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4.500a3.500 3.500 0 0 1 0 6.500M18 14a7 7 0 0 1 4 6',rep:'M5 20V12M12 20V4M19 20v-6',gear:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2 2M16.400 16.400l2 2M5.600 18.400l2-2M16.400 7.600l2-2',hp:'M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z',cmp:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15 9l-2 4-4 2 2-4z',sort:'M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4',cup:'M5 4h14l-2 10a4 4 0 0 1-4 3h-2a4 4 0 0 1-4-3zM19 6h1a2 2 0 0 1 0 5h-2M7 21h10',cash:'M3 7h18v10H3zM12 9.500a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5z',pp:'M12 4v16M5 8h14M7 8l-3 6a3 3 0 0 0 6 0zM17 8l-3 6a3 3 0 0 0 6 0z',ar:'M5 12h14M13 6l6 6-6 6',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 11a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',x:'M6 6l12 12M18 6L6 18',star:'M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z',prn:'M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z'};
const I=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="${s}"`:''}><path d="${P[n]}"/></svg>`;
const hd=(t,sub,x='',b='back')=>`<div class="ph row"><button class="ib" onclick="go('home')" aria-label="Back">${I('back')}</button><div class="fx"><h1>${t}</h1><p>${sub}</p></div>${x}</div>`;

const ch=(a,on=0)=>`<div class="chips">${a.map((x,i)=>`<button class="c${i==on?' on':''}">${x}</button>`).join('')}</div>`;
const IT=[['Tea','🍵',12,7],['Strong Tea','☕',15,9],['Milk Coffee','🥛',20,12],['Black Tea','🫖',10,6],['Boost','🍫',25,15],['Horlicks','🥤',25,15],['Ginger Tea','🫚',15,9],['Elaichi Tea','🌿',18,11],['Vada','🍩',12,7],['Bonda','🧆',10,6],['Samosa','🥟',15,9],['Bun Butter','🍔',30,18]];
const S={};
S.home=`<div class="row" style="margin:22px 0 14px"><div class="fx"><h1 style="font-size:26px;font-weight:800;letter-spacing:-.03em">Good Morning</h1><p class="mu" style="margin-top:3px">Raja tea stall · Ready for billing</p></div><span class="badge">OWNER</span></div>
<section class="hero" style="padding:20px"><div class="row"><span class="lab fx" style="color:#fff;opacity:.85"><span class="dot"></span>Sales</span><span style="font-size:12px;opacity:.65">0 bills</span></div><div class="big" style="font-size:54px;margin:10px 0 0"><small style="font-size:30px;opacity:.7">₹</small>0</div>
<div class="seg">${['Day','Week','Month','Year','Custom'].map((x,i)=>`<button class="${i?'':'on'}">${x}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:14px" onclick="go('sales')">${I('plus')}New Bill</button></section>
<div class="grid2" style="margin-top:12px">${[['Expenses','₹0','0 entries'],['Profit','₹0','Profit']].map(([a,b,c])=>`<div class="card mini"><div class="lab">${a}</div><div class="big">${b}</div><div class="mu">${c}</div></div>`).join('')}</div>
<button class="lk" onclick="go('pending')"><div class="ic">${I('clk')}</div><div class="fx"><div class="lab">Pending</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px">₹10</div><span class="mu">1 customer</span></div><span style="color:var(--or);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px">View ledger${I('ar','width:16px')}</span></button>

<h2>Day of week</h2><div class="days">${[...'MTWTFSS'].map(x=>`<div>${x}</div>`).join('')}</div><h2>Product growth</h2><p class="mu">Appears once bills are recorded</p>`;
S.sales=`<div class="amtbar" style="margin-top:20px"><label class="search" style="margin:0;flex:1">${I('se')}<input placeholder="Search items…" oninput="flt(this.value)"></label><button class="ib" style="width:auto;padding:0 16px;gap:8px;display:flex;color:var(--or);font-weight:700;font-size:14px" onclick="go('menu')">${I('ed')}Menu</button></div>
${ch(['All','Tea & Coffees','Snacks','Cold'])}<p class="lab" style="margin:14px 0 2px;font-size:10.5px;font-weight:600">Tap = full · Hold = half · [−] = minus</p>
